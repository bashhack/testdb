services:
  test-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"
      - "-c"
      - "max_connections=300"

  test-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-proot", "-e", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Durability off, as for Postgres above: this server only ever holds
    # throwaway test databases, and these settings make every DDL and drop
    # markedly faster.
    command:
      - "--innodb-flush-log-at-trx-commit=0"
      - "--sync-binlog=0"
      - "--skip-log-bin"
      - "--innodb-doublewrite=0"
      - "--innodb-flush-method=O_DIRECT_NO_FSYNC"

  # MariaDB on 3307: point TEST_MYSQL_URL at it to run the MySQL suite
  # against MariaDB, as CI does.
  test-mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 12
    command:
      - "--innodb-flush-log-at-trx-commit=0"
      - "--skip-log-bin"
      - "--innodb-doublewrite=0"
      - "--innodb-flush-method=O_DIRECT_NO_FSYNC"
