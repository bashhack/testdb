name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-go:
    name: Test Go Implementation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go-version: ['1.27']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysql -uroot -proot -e 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Cache Go tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Install tools
        run: |
          command -v staticcheck || go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: latest
          # The adapters are separate modules; ./... alone covers only the root
          args: ./... ./migrate/goose/... ./migrate/tern/... ./migrate/golangmigrate/...

      - name: Run linters
        run: make lint

      - name: Run unit tests and generate coverage
        run: |
          GOMAXPROCS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4) go test -v github.com/bashhack/testdb/...
          go test -coverprofile=coverage.txt github.com/bashhack/testdb/...
          go tool cover -html=coverage.txt -o coverage.html

      - name: Run tests with race detection
        run: |
          CORES=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)
          RACE_CORES=$([ $CORES -gt 4 ] && echo 4 || echo $CORES)
          GOMAXPROCS=$RACE_CORES go test -race github.com/bashhack/testdb/...

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: go-coverage-report-${{ matrix.os }}
          path: ./coverage.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7
        with:
          files: ./coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}

  test-mariadb:
    name: MySQL suite on MariaDB
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27'
          cache: true

      # The mysql package and the adapters' MySQL tests, against MariaDB on
      # the default MySQL address. The Postgres-backed tests are the other
      # job's business.
      - name: Run the MySQL-backed tests against MariaDB
        run: |
          go test -race -count=1 ./mysql/...
          go test -race -count=1 -run 'TestMySQL' ./migrate/goose/... ./migrate/golangmigrate/...
